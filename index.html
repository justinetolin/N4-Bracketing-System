<body><main class="app" id="app"><header class="top"><div class="brand"><h1><span>N4</span> BRACKET CONTROL</h1><div class="event">NIGHT 4&nbsp; // &nbsp;NOV 29, 2026&nbsp; // &nbsp;LIVE OPS</div></div><div class="actions controls"><button class="button primary" id="random">⟳ Randomize</button><button class="button" id="export">↓ Export JSON</button><button class="button" id="load">↑ Import / Load</button><button class="button danger" id="reset">Reset Match</button><button class="button" id="stream">◎ Stream Mode</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<nav class="tabs controls" aria-label="Game selection"><button class="tab active" data-game="codm">COD: MOBILE</button><button class="tab" data-game="mlbb">MOBILE LEGENDS</button><button class="button" id="dual">⇄ Side-by-Side / Dual View</button></nav><div class="subbar controls"><div class="hint" id="gameHint">CODM // MATCH CONTROL · Click a team row to set the winner.</div><div class="status" id="status" aria-live="polite"></div></div><section id="single"></section><section id="dualView" class="games" hidden></section><footer class="footer"><span>N4 // BROADCAST CONTROL SYSTEM</span><span>LOCAL AUTOSAVE <b id="saveState" style="color:#75c7d0">● ACTIVE</b></span></footer></main>
<script>
(()=>{'use strict';
const teams={Aurelia:{icon:'./icons/Aurelia.PNG',mono:'AU'},Florea:{icon:'./icons/Florea.PNG',mono:'FL'},Frostveil:{icon:'./icons/Frostveil.PNG',fallback:'./icons/FrostveiI.PNG',mono:'FR'},Solaris:{icon:'./icons/Solaris.PNG',mono:'SO'}};
const initial=()=>({event:'Night 4',date:'2026-11-29',activeGame:'mlbb',brackets:{codm:{seeds:['Aurelia','Solaris','Florea','Frostveil'],winners:{p1:null,p2:null,third:null,finals:null}},mlbb:{seeds:['Solaris','Frostveil','Aurelia','Florea'],winners:{p1:null,p2:null,third:null,finals:null}}}});
let state=initial(),dual=false,stream=false,rollTimer=null;const $=s=>document.querySelector(s),app=$('#app');
function validState(x){if(!x||typeof x!=='object'||!x.brackets||!['codm','mlbb'].every(g=>x.brackets[g]))return false;for(const g of ['codm','mlbb']){const b=x.brackets[g];if(!Array.isArray(b.seeds)||b.seeds.length!==4||new Set(b.seeds).size!==4||b.seeds.some(t=>!teams[t])||!b.winners||['p1','p2','third','finals'].some(k=>b.winners[k]!==null&&!teams[b.winners[k]]))return false}return x.activeGame==='codm'||x.activeGame==='mlbb'}
function normalize(x){const d=initial();for(const g of ['codm','mlbb']){d.brackets[g].seeds=x.brackets[g].seeds.slice();d.brackets[g].winners={...d.brackets[g].winners,...x.brackets[g].winners}}d.activeGame=x.activeGame;return d}
function save(){try{localStorage.setItem('n4-bracket-state-v1',JSON.stringify(state));$('#saveState').textContent='● ACTIVE';$('#saveState').style.color='#75c7d0'}catch{$('#saveState').textContent='● UNAVAILABLE';$('#saveState').style.color='#ff809f'}}
function restore(){try{const x=JSON.parse(localStorage.getItem('n4-bracket-state-v1'));if(validState(x))state=normalize(x)}catch{}}
function entrants(b,key){if(key==='p1')return[b.seeds[0],b.seeds[1]];if(key==='p2')return[b.seeds[2],b.seeds[3]];const k=key==='finals'?'p':'p';return key==='finals'?[b.winners.p1,b.winners.p2].map((w,i)=>w? (i===0?winner(b,'p1'):winner(b,'p2')):null):[b.winners.p1,b.winners.p2].map((w,i)=>w?(i===0?loser(b,'p1'):loser(b,'p2')):null)}
function winner(b,k){return b.winners[k]||null}function loser(b,k){const pair=entrants(b,k);return b.winners[k]?pair.find(t=>t&&t!==b.winners[k])||null:null}
function setWinner(game,key,team){const b=state.brackets[game];if(key==='p1'||key==='p2'){if(!entrants(b,key).includes(team))return;b.winners[key]=b.winners[key]===team?null:team;b.winners.third=null;b.winners.finals=null}else{const pair=entrants(b,key);if(!pair.includes(team)||pair.some(x=>!x))return;b.winners[key]=b.winners[key]===team?null:team}save();render()}
function badge(team){const t=team&&teams[team];if(!t)return'<span class="badge">??</span>';return`<span class="badge"><img src="${t.icon}" data-fallback="${t.fallback||''}" alt="${team} emblem" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback=''}else{this.replaceWith(Object.assign(document.createElement('span'),{className:'badge',textContent:'${t.mono}'}))}"></span>`}
function slot(team,game,key,disabled=false){const b=state.brackets[game],w=b.winners[key],isWinner=w===team,isLoser=!!w&&w!==team;return`<button class="slot ${team?'':'empty'} ${isWinner?'winner':''} ${isLoser?'loser':''}" ${!team||disabled?'disabled':''} data-game="${game}" data-key="${key}" data-team="${team||''}">${badge(team)}<span class="teamname">${team||'Awaiting qualifier'}</span>${isWinner?'<span class="winlabel">WINNER</span>':isLoser?'<span class="winlabel">ELIM.</span>':''}</button>`}
function match(title,key,pair,game,extra=''){return`<article class="match ${extra}"><div class="match-head"><span>${title}</span><span>${key==='p1'?'M01':key==='p2'?'M02':key==='third'?'M03':'M04'}</span></div>${slot(pair[0],game,key,!pair[0])}${slot(pair[1],game,key,!pair[1])}</article>`}
function gameView(game,compact=false){const b=state.brackets[game],active=state.activeGame===game;const finalLoser=loser(b,'finals'),fourth=loser(b,'third');return`<div class="game-panel" style="--panel-accent:${game==='codm'?'var(--cyan)':'var(--pink)'}"><div class="panel-top"><h2>${game==='codm'?'COD: MOBILE':'MOBILE LEGENDS'}</h2>${compact?`<span class="hint">${active?'ACTIVE':'NIGHT 4'}</span>`:''}</div><div class="board"><section class="round prelim"><h3 class="round-title">01 // PRELIMINARIES</h3>${match('PRELIM 01','p1',entrants(b,'p1'),game)}<div class="connector"></div>${match('PRELIM 02','p2',entrants(b,'p2'),game)}</section><section class="round split"><h3 class="round-title">02 // PLACEMENT PATHS</h3>${match('GRAND FINALS','finals',entrants(b,'finals'),game)}${match('THIRD-PLACE PLAYOFF','third',entrants(b,'third'),game)}</section><section class="round finals"><h3 class="round-title">03 // FINAL STANDINGS</h3><div class="podium">✦ CHAMPION · 1ST</div>${slot(b.winners.finals,game,'finals',true)}<div class="empty-note">${b.winners.finals?'NIGHT 4 CHAMPION':'Winner of Grand Finals'}</div><div class="podium third-title" style="margin-top:16px">◈ 1ST RUNNER-UP · 2ND</div>${slot(finalLoser,game,'finals',true)}<div class="empty-note">${finalLoser?'FINALIST':'Loser of Grand Finals'}</div><div class="podium third-title" style="margin-top:16px">◈ 2ND RUNNER-UP · 3RD</div>${slot(b.winners.third,game,'third',true)}<div class="empty-note">${b.winners.third?'PODIUM LOCKED':'Winner of Third-Place Playoff'}</div><div class="podium third-title" style="margin-top:16px">◈ 3RD RUNNER-UP · 4TH</div>${slot(fourth,game,'third',true)}<div class="empty-note">${fourth?'PODIUM LOCKED':'Loser of Third-Place Playoff'}</div></section></div></div>`}
function render(){document.documentElement.style.setProperty('--accent',state.activeGame==='codm'?'var(--cyan)':'var(--pink)');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.game===state.activeGame));$('#gameHint').textContent=`${state.activeGame.toUpperCase()} // MATCH CONTROL · Click a team row to set the winner.`;$('#single').hidden=dual;$('#dualView').hidden=!dual;if(dual){$('#dualView').innerHTML=`<div class="games-inner">${gameView('codm',true)}${gameView('mlbb',true)}</div>`}else $('#single').innerHTML=gameView(state.activeGame);document.body.classList.toggle('stream',stream);document.body.classList.toggle('dual',dual);$('#stream').textContent=stream?'◉ Stream Mode: ON':'◎ Stream Mode';$('#dual').classList.toggle('primary',dual)}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function randomize(){const games=dual?['codm','mlbb']:[state.activeGame];const hasResults=games.some(g=>Object.values(state.brackets[g].winners).some(Boolean));if(hasResults&&!confirm('This bracket has results. Shuffle seeds and clear its current results?'))return;const bcount=games.length;let count=0;clearInterval(rollTimer);const roll=()=>{for(const g of games){const b=state.brackets[g];b.seeds=shuffle(Object.keys(teams));for(const key of ['p1','p2','third','finals'])b.winners[key]=null}render();if(++count>=6){clearInterval(rollTimer);save();$('#status').textContent=`${bcount===2?'Both brackets':'Bracket'} randomized · ready for broadcast.`}};rollTimer=setInterval(roll,100);setTimeout(()=>{if(rollTimer){clearInterval(rollTimer);rollTimer=null;save()}},720)}
function exportState(){const out={...state,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`night4-bracket-2026-11-29.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#status').textContent='Bracket state exported.'}
async function importFile(file){try{const raw=JSON.parse(await file.text());if(!validState(raw))throw Error('Invalid bracket data. Check both games, four unique seeds per bracket, winner keys, and team names.');state=normalize(raw);save();render();$('#status').textContent='Match state loaded successfully.'}catch(e){$('#status').textContent=e.message;alert(e.message)}}
document.addEventListener('click',e=>{const tab=e.target.closest('.tab');if(tab){state.activeGame=tab.dataset.game;save();render();return}const s=e.target.closest('.slot[data-team]');if(s&&s.dataset.team){setWinner(s.dataset.game,s.dataset.key,s.dataset.team)}});
$('#random').addEventListener('click',randomize);$('#export').addEventListener('click',exportState);$('#load').addEventListener('click',()=>$('#file').click());$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''});$('#reset').addEventListener('click',()=>{if(confirm('Reset results and seed order for '+(dual?'both games':state.activeGame.toUpperCase())+'?')){for(const g of (dual?['codm','mlbb']:[state.activeGame]))state.brackets[g]=initial().brackets[g];save();render();$('#status').textContent='Selected bracket reset.'}});$('#stream').addEventListener('click',()=>{stream=!stream;render()});$('#dual').addEventListener('click',()=>{dual=!dual;render()});
restore();render();
