.stream .top{display:flex;flex-direction:row;justify-content:space-between;align-items:center;text-align:left;gap:clamp(14px,3vw,44px)}
.stream .brand{flex:0 1 auto;text-align:left}
.stream .live-game-title{display:block;flex:0 1 auto;margin-left:auto;text-align:right;font:700 clamp(16px,2vw,28px) Orbitron,sans-serif;letter-spacing:.08em;line-height:1.15;color:#f5f4ff;text-shadow:0 0 24px color-mix(in srgb,var(--accent),transparent 28%)}
.stream .panel-top{display:none!important}
.stream .actions.controls{flex:0 0 0;width:0;min-width:0}
@media(max-width:900px){.stream .top{flex-direction:row}.stream .live-game-title{font-size:clamp(12px,1.8vw,18px)}}
@media(max-width:620px){.stream .top{gap:8px}.stream .brand h1{font-size:22px}.stream .live-game-title{max-width:45vw;font-size:clamp(9px,2.8vw,12px);letter-spacing:.02em;white-space:normal}}
/* Operator authentication and read-only viewer */
.viewer-only .controls{display:none!important}.cloud-status{color:#b9c5df;font:10px 'Share Tech Mono',monospace;letter-spacing:.06em}.viewer-only .cloud-status{color:#ccefff}.operator-dialog{width:min(420px,calc(100vw - 32px));border:1px solid #4c4f76;background:linear-gradient(145deg,#191a32,#0b0c19);color:#f4f4ff;box-shadow:0 24px 80px #000b;padding:0;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}.operator-dialog::backdrop{background:#050510bb;backdrop-filter:blur(6px)}.operator-dialog form{padding:24px;display:grid;gap:14px}.operator-dialog h2{font:700 18px Orbitron,sans-serif;margin:0 0 4px;color:#9ff8ff}.operator-dialog label{display:grid;gap:6px;color:#b9c5df;font-size:12px}.operator-dialog input{min-width:0;padding:10px;border:1px solid #ffffff38;background:#0b0c19;color:#fff;font:14px 'Share Tech Mono',monospace}.operator-dialog input:focus{outline:1px solid var(--cyan)}.operator-dialog #authError{min-height:18px;color:#ff92b6;font-size:12px;margin:0}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
.viewer-only .live-hint{display:none}</style></head>
<body><div class="ambient" aria-hidden="true"></div><div id="liveHint" class="live-hint" aria-hidden="true">LIVE // PRESS L FOR CONTROLS</div><main class="app" id="app"><header class="top"><div class="brand"><h1><span>N4</span> BRACKET CONTROL</h1><div class="event">NIGHT 4&nbsp; // &nbsp;NOV 29, 2026&nbsp; // &nbsp;LIVE OPS</div></div><div id="liveGameTitle" class="live-game-title" aria-live="polite"></div><div class="actions controls"><button class="button primary" id="random">⟳ Randomize</button><button class="button" id="export">↓ Export JSON</button><button class="button" id="load">↑ Import / Load</button><button class="button danger" id="reset">Reset Match</button><button class="button" id="stream">◎ Live Mode</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<nav class="tabs controls" aria-label="Game selection"><button class="tab active" data-game="codm">COD: MOBILE</button><button class="tab" data-game="mlbb">MOBILE LEGENDS</button><button class="button" id="dual">⇄ Side-by-Side / Dual View</button></nav><div class="subbar controls"><div class="hint" id="gameHint">CODM // MATCH CONTROL · Click a team row to set the winner.</div><div class="status" id="status" aria-live="polite"></div></div><section id="single"></section><section id="dualView" class="games" hidden></section><footer class="footer"><span>N4 // BROADCAST CONTROL SYSTEM</span><span>LOCAL AUTOSAVE <b id="saveState" style="color:#75c7d0">● ACTIVE</b></span></footer></main>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
(()=>{'use strict';
const teams={Aurelia:{icon:'./icons/Aurelia.PNG',mono:'AU'},Florea:{icon:'./icons/Florea.PNG',mono:'FL'},Frostveil:{icon:'./icons/Frostveil.PNG',fallback:'./icons/FrostveiI.PNG',mono:'FR'},Solaris:{icon:'./icons/Solaris.PNG',mono:'SO'}};
const initial=()=>({event:'Night 4',date:'2026-11-29',activeGame:'mlbb',brackets:{codm:{seeds:['Aurelia','Solaris','Florea','Frostveil'],winners:{p1:null,p2:null,third:null,finals:null}},mlbb:{seeds:['Solaris','Frostveil','Aurelia','Florea'],winners:{p1:null,p2:null,third:null,finals:null}}}});
const viewerMode=new URLSearchParams(location.search).get('view')==='screen';
let state=initial(),dual=false,stream=viewerMode,rollTimer=null,auth=null,cloudStateRef=null,signedUser=null,stateListener=null,authButton=null,authDialog=null;
const $=s=>document.querySelector(s),app=$('#app');
function validState(x){if(!x||typeof x!=='object'||!x.brackets||!['codm','mlbb'].every(g=>x.brackets[g]))return false;for(const g of ['codm','mlbb']){const b=x.brackets[g];if(!Array.isArray(b.seeds)||b.seeds.length!==4||new Set(b.seeds).size!==4||b.seeds.some(t=>!teams[t])||(b.winners&&['p1','p2','third','finals'].some(k=>b.winners[k]!=null&&!teams[b.winners[k]])))return false}return x.activeGame==='codm'||x.activeGame==='mlbb'}
function normalize(x){const d=initial();for(const g of ['codm','mlbb']){d.brackets[g].seeds=x.brackets[g].seeds.slice();d.brackets[g].winners={...d.brackets[g].winners,...(x.brackets[g].winners||{})}}d.activeGame=x.activeGame;return d}
function saveLocal(){try{localStorage.setItem('n4-bracket-state-v1',JSON.stringify(state));$('#saveState').textContent='● ACTIVE';$('#saveState').style.color='#75c7d0'}catch{$('#saveState').textContent='● UNAVAILABLE';$('#saveState').style.color='#ff809f'}}
function isAuthorizedOperator(){return !!signedUser&&signedUser.uid===window.N4_OPERATOR_UID&&window.N4_OPERATOR_UID!=='REPLACE_WITH_OPERATOR_UID'}
function setCloudStatus(message){const el=$('#cloudStatus');if(el)el.textContent=message+(viewerMode?' · Press C: CODM · Press M: MLBB':'')}
function save(){saveLocal();if(viewerMode){setCloudStatus('VIEW ONLY');return}if(!cloudStateRef){setCloudStatus('CLOUD NOT CONFIGURED');return}if(!isAuthorizedOperator()){setCloudStatus(signedUser?'NOT AUTHORIZED':'SIGN IN TO SYNC');return}cloudStateRef.set({...state,updatedAt:firebase.database.ServerValue.TIMESTAMP}).then(()=>setCloudStatus('LIVE SYNC')).catch(()=>setCloudStatus('SYNC FAILED · LOCAL SAVE OK'))}
function restore(){try{const x=JSON.parse(localStorage.getItem('n4-bracket-state-v1'));if(validState(x))state=normalize(x)}catch{}}
function entrants(b,key){if(key==='p1')return[b.seeds[0],b.seeds[1]];if(key==='p2')return[b.seeds[2],b.seeds[3]];const k=key==='finals'?'p':'p';return key==='finals'?[b.winners.p1,b.winners.p2].map((w,i)=>w? (i===0?winner(b,'p1'):winner(b,'p2')):null):[b.winners.p1,b.winners.p2].map((w,i)=>w?(i===0?loser(b,'p1'):loser(b,'p2')):null)}
function winner(b,k){return b.winners[k]||null}function loser(b,k){const pair=entrants(b,k);return b.winners[k]?pair.find(t=>t&&t!==b.winners[k])||null:null}
function setWinner(game,key,team){const b=state.brackets[game];if(key==='p1'||key==='p2'){if(!entrants(b,key).includes(team))return;b.winners[key]=b.winners[key]===team?null:team;b.winners.third=null;b.winners.finals=null}else{const pair=entrants(b,key);if(!pair.includes(team)||pair.some(x=>!x))return;b.winners[key]=b.winners[key]===team?null:team}save();render()}
function badge(team){const t=team&&teams[team];if(!t)return'<span class="badge">??</span>';return`<span class="badge"><img src="${t.icon}" data-fallback="${t.fallback||''}" alt="${team} emblem" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback=''}else{this.replaceWith(Object.assign(document.createElement('span'),{className:'badge',textContent:'${t.mono}'}))}"></span>`}
function slot(team,game,key,disabled=false){const b=state.brackets[game],w=b.winners[key],isWinner=w===team,isLoser=!!w&&w!==team;disabled=disabled||viewerMode;return`<button class="slot ${team?'':'empty'} ${isWinner?'winner':''} ${isLoser?'loser':''}" ${!team||disabled?'disabled':''} data-game="${game}" data-key="${key}" data-team="${team||''}">${badge(team)}<span class="teamname">${team||'Awaiting qualifier'}</span>${isWinner?'<span class="winlabel">WINNER</span>':isLoser?'<span class="winlabel">ELIM.</span>':''}</button>`}
function match(title,key,pair,game,extra=''){return`<article class="match ${extra}"><div class="match-head"><span>${title}</span><span>${key==='p1'?'M01':key==='p2'?'M02':key==='third'?'M03':'M04'}</span></div>${slot(pair[0],game,key,!pair[0])}${slot(pair[1],game,key,!pair[1])}</article>`}
function gameView(game,compact=false){const b=state.brackets[game],active=state.activeGame===game;const finalLoser=loser(b,'finals'),fourth=loser(b,'third');return`<div class="game-panel" style="--panel-accent:${game==='codm'?'var(--cyan)':'var(--pink)'}"><div class="panel-top"><h2>${game==='codm'?'COD: MOBILE':'MOBILE LEGENDS'}</h2>${compact?`<span class="hint">${active?'ACTIVE':'NIGHT 4'}</span>`:''}</div><div class="board"><section class="round prelim"><h3 class="round-title">01 // PRELIMINARIES</h3>${match('PRELIM 01','p1',entrants(b,'p1'),game)}<div class="connector"></div>${match('PRELIM 02','p2',entrants(b,'p2'),game)}</section><section class="round split"><h3 class="round-title">02 // PLACEMENT PATHS</h3>${match('GRAND FINALS','finals',entrants(b,'finals'),game)}${match('THIRD-PLACE PLAYOFF','third',entrants(b,'third'),game)}</section><section class="round finals"><h3 class="round-title">03 // FINAL STANDINGS</h3><div class="podium">✦ CHAMPION · 1ST</div>${slot(b.winners.finals,game,'finals',true)}<div class="empty-note">${b.winners.finals?'NIGHT 4 CHAMPION':'Winner of Grand Finals'}</div><div class="podium third-title" style="margin-top:16px">◈ 1ST RUNNER-UP · 2ND</div>${slot(finalLoser,game,'finals',true)}<div class="empty-note">${finalLoser?'FINALIST':'Loser of Grand Finals'}</div><div class="podium third-title" style="margin-top:16px">◈ 2ND RUNNER-UP · 3RD</div>${slot(b.winners.third,game,'third',true)}<div class="empty-note">${b.winners.third?'PODIUM LOCKED':'Winner of Third-Place Playoff'}</div><div class="podium third-title" style="margin-top:16px">◈ 3RD RUNNER-UP · 4TH</div>${slot(fourth,game,'third',true)}<div class="empty-note">${fourth?'PODIUM LOCKED':'Loser of Third-Place Playoff'}</div></section></div></div>`}
function setupAuthUi(){document.body.classList.toggle('viewer-only',viewerMode);const footer=$('.footer'),cloudLabel=document.createElement('span');cloudLabel.id='cloudStatus';cloudLabel.className='cloud-status';cloudLabel.textContent='CONNECTING';footer.insertBefore(cloudLabel,footer.firstChild);if(viewerMode){$('#liveHint').textContent='C  /  CODM     ·     M  /  MLBB';return}authButton=document.createElement('button');authButton.type='button';authButton.id='authButton';authButton.className='button';authButton.textContent='Operator Sign In';document.querySelector('.actions').insertBefore(authButton,$('#file'));authButton.addEventListener('click',()=>{if(!auth)return;if(signedUser)auth.signOut();else authDialog.showModal()});authDialog=document.createElement('dialog');authDialog.className='operator-dialog';authDialog.innerHTML='<form id="operatorLogin"><h2>Operator Sign In</h2><p>Enter the shared operator password.</p><label>Password<input name="password" type="password" autocomplete="current-password" required></label><p id="authError" role="alert"></p><div class="dialog-actions"><button type="button" class="button" id="cancelLogin">Cancel</button><button type="submit" class="button primary">Sign In</button></div></form>';document.body.append(authDialog);$('#cancelLogin').addEventListener('click',()=>authDialog.close());$('#operatorLogin').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;try{await auth.signInWithEmailAndPassword(window.N4_OPERATOR_EMAIL,form.password.value);form.reset();authDialog.close()}catch(err){$('#authError').textContent='Sign-in failed. Check the shared operator password.'}})}
function subscribeToState(){if(!cloudStateRef)return;if(stateListener)cloudStateRef.off('value',stateListener);stateListener=(snapshot)=>{const remote=snapshot.val();if(remote===null){if(isAuthorizedOperator())cloudStateRef.set({...state,updatedAt:firebase.database.ServerValue.TIMESTAMP}).then(()=>setCloudStatus('LIVE SYNC')).catch(()=>setCloudStatus('DATABASE WRITE DENIED'));else setCloudStatus('WAITING FOR OPERATOR');return}if(validState(remote)){state=normalize(remote);saveLocal();render();setCloudStatus(viewerMode?'LIVE VIEW':'LIVE SYNC')}else setCloudStatus('INVALID REMOTE BRACKET')};cloudStateRef.on('value',stateListener,()=>setCloudStatus('DATABASE READ DENIED'))}
function initCloud(){setupAuthUi();const config=window.N4_FIREBASE_CONFIG;if(!window.firebase||!config||!config.apiKey||config.apiKey.startsWith('YOUR_')||!config.databaseURL||config.databaseURL.includes('YOUR_')||!window.N4_OPERATOR_UID||window.N4_OPERATOR_UID==='REPLACE_WITH_OPERATOR_UID'||!window.N4_OPERATOR_EMAIL||window.N4_OPERATOR_EMAIL.startsWith('YOUR_')){setCloudStatus(viewerMode?'VIEWER · CLOUD NOT CONFIGURED':'LOCAL ONLY · ADD FIREBASE CONFIG');if(authButton)authButton.disabled=true;return}try{if(!firebase.apps.length)firebase.initializeApp(config);auth=firebase.auth();cloudStateRef=firebase.database().ref('night4/current');if(viewerMode){subscribeToState();return}auth.onAuthStateChanged(user=>{signedUser=user;authButton.textContent=user?'Operator Sign Out':'Operator Sign In';authButton.disabled=false;if(isAuthorizedOperator()){setCloudStatus('CONNECTING');subscribeToState()}else{if(stateListener)cloudStateRef.off('value',stateListener);stateListener=null;setCloudStatus(user?'ACCOUNT NOT AUTHORIZED':'SIGN IN TO SYNC')}})}catch{setCloudStatus('FIREBASE CONFIG ERROR')}}
function renderContent(){document.documentElement.style.setProperty('--accent',state.activeGame==='codm'?'var(--cyan)':'var(--pink)');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.game===state.activeGame));$('#gameHint').textContent=`${state.activeGame.toUpperCase()} // MATCH CONTROL · Click a team row to set the winner.`;$('#liveGameTitle').textContent=state.activeGame==='codm'?'CALL OF DUTY: MOBILE':'MOBILE LEGENDS: BANG BANG';$('#single').hidden=dual;$('#dualView').hidden=!dual;if(dual){$('#dualView').innerHTML=`<div class="games-inner">${gameView('codm',true)}${gameView('mlbb',true)}</div>`}else $('#single').innerHTML=gameView(state.activeGame);document.body.classList.toggle('stream',stream);document.body.classList.toggle('dual',dual);$('#stream').textContent=stream?'◉ Live Mode: ON':'◎ Live Mode';$('#dual').classList.toggle('primary',dual)}
function render(){if(document.startViewTransition){document.startViewTransition(renderContent)}else renderContent()}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function randomize(){const games=dual?['codm','mlbb']:[state.activeGame];const hasResults=games.some(g=>Object.values(state.brackets[g].winners).some(Boolean));if(hasResults&&!confirm('This bracket has results. Shuffle seeds and clear its current results?'))return;const bcount=games.length;let count=0;clearInterval(rollTimer);const roll=()=>{for(const g of games){const b=state.brackets[g];b.seeds=shuffle(Object.keys(teams));for(const key of ['p1','p2','third','finals'])b.winners[key]=null}render();if(++count>=6){clearInterval(rollTimer);save();$('#status').textContent=`${bcount===2?'Both brackets':'Bracket'} randomized · ready for broadcast.`}};rollTimer=setInterval(roll,100);setTimeout(()=>{if(rollTimer){clearInterval(rollTimer);rollTimer=null;save()}},720)}
function exportState(){const out={...state,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`night4-bracket-2026-11-29.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#status').textContent='Bracket state exported.'}
async function importFile(file){try{const raw=JSON.parse(await file.text());if(!validState(raw))throw Error('Invalid bracket data. Check both games, four unique seeds per bracket, winner keys, and team names.');state=normalize(raw);save();render();$('#status').textContent='Match state loaded successfully.'}catch(e){$('#status').textContent=e.message;alert(e.message)}}
document.addEventListener('click',e=>{if(viewerMode)return;const tab=e.target.closest('.tab');if(tab){state.activeGame=tab.dataset.game;save();render();return}const s=e.target.closest('.slot[data-team]');if(s&&s.dataset.team){setWinner(s.dataset.game,s.dataset.key,s.dataset.team)}});
$('#random').addEventListener('click',randomize);$('#export').addEventListener('click',exportState);$('#load').addEventListener('click',()=>$('#file').click());$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''});$('#reset').addEventListener('click',()=>{if(confirm('Reset results and seed order for '+(dual?'both games':state.activeGame.toUpperCase())+'?')){for(const g of (dual?['codm','mlbb']:[state.activeGame]))state.brackets[g]=initial().brackets[g];save();render();$('#status').textContent='Selected bracket reset.'}});$('#dual').addEventListener('click',()=>{dual=!dual;render()});
restore();render();initCloud();
let liveHintTimer;function showLiveHint(){const hint=$('#liveHint');hint.classList.add('visible');clearTimeout(liveHintTimer);liveHintTimer=setTimeout(()=>hint.classList.remove('visible'),3000)}
function toggleLiveMode(){if(viewerMode)return;stream=!stream;render();if(stream)showLiveHint()}
$('#stream').addEventListener('click',toggleLiveMode);
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable="true"]'))return;const key=e.key.toLowerCase();if(key==='escape'&&stream&&!viewerMode){stream=false;render();return}if(key==='l'){e.preventDefault();toggleLiveMode();return}if(key==='c'||key==='1'){state.activeGame='codm';save();render();return}if(key==='m'||key==='2'){state.activeGame='mlbb';save();render()}});
})();
</script></body></html>
